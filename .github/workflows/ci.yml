name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: "Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic regression suite
        run: python -m unittest discover -s tests -v

      - name: Check all Workbench JavaScript syntax
        shell: pwsh
        run: |
          $scripts = @(Get-ChildItem -LiteralPath src/sasori_web -Filter *.js)
          if ($scripts.Count -eq 0) { throw "Workbench JavaScript is missing" }
          foreach ($script in $scripts) {
            node --check $script.FullName
            if ($LASTEXITCODE -ne 0) { throw "invalid JavaScript: $($script.Name)" }
          }

      - name: Run Workbench event-consumer contracts
        run: node --test tests/workbench_event_reducer.test.cjs

      - name: Run Workbench delayed-response browser acceptance
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12' }}
        run: python tests/workbench_browser_acceptance.py --require-browser

      - name: Ensure tests did not change tracked files
        run: git diff --exit-code HEAD --

  container:
    name: Container product gate
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: sasori-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHON_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Prepare isolated Compose inputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import secrets
          import socket
          import stat
          from pathlib import Path

          suffix = f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          root = Path(os.environ["RUNNER_TEMP"])
          paths = {
              "SASORI_TOKEN_FILE": root / f"sasori-token-{suffix}",
              "CONTAINER_EVIDENCE_FILE": root / f"sasori-container-evidence-{suffix}.json",
              "ACTION_PAUSED_FILE": root / f"sasori-action-paused-{suffix}.json",
              "ACTION_COMPLETE_FILE": root / f"sasori-action-complete-{suffix}.json",
              "ACTION_RESTARTED_FILE": root / f"sasori-action-restarted-{suffix}.json",
              "OWNER_LOG_FILE": root / f"sasori-owner-{suffix}.log",
              "RUNTIME_LOG_FILE": root / f"sasori-runtime-{suffix}.log",
          }
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as listener:
              listener.bind(("127.0.0.1", 0))
              port = listener.getsockname()[1]
          token = secrets.token_urlsafe(48)
          token_fd = os.open(
              paths["SASORI_TOKEN_FILE"],
              os.O_WRONLY | os.O_CREAT | os.O_EXCL,
              0o600,
          )
          try:
              with os.fdopen(token_fd, "wb") as stream:
                  token_fd = -1
                  stream.write((token + "\n").encode("ascii"))
                  stream.flush()
                  os.fchmod(stream.fileno(), 0o640)
                  token_stat = os.fstat(stream.fileno())
          finally:
              if token_fd >= 0:
                  os.close(token_fd)
          if stat.S_IMODE(token_stat.st_mode) != 0o640:
              raise SystemExit("token file mode is invalid")
          values = {
              **{key: str(value) for key, value in paths.items()},
              "SASORI_PORT": str(port),
              "SASORI_BASE_URL": f"http://127.0.0.1:{port}",
              "SASORI_ACCEPTANCE_RUN_ID": f"container-{suffix}",
              "SASORI_TOKEN_GID": str(token_stat.st_gid),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
          print(f"::add-mask::{token}")
          PY

      - name: Build through configured mainland sources
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" config --quiet
          docker compose -p "$COMPOSE_PROJECT_NAME" build --no-cache --pull sasori

      - name: Start the Compose candidate image
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker compose -p "$COMPOSE_PROJECT_NAME" up \
            -d --wait --wait-timeout 120 sasori
          start_status=$?
          set -e
          if [[ "$start_status" -ne 0 ]]; then
            : > "$RUNTIME_LOG_FILE"
            docker compose -p "$COMPOSE_PROJECT_NAME" logs --no-color sasori \
              > "$RUNTIME_LOG_FILE" 2>&1 || true
            token="$(<"$SASORI_TOKEN_FILE")"
            if [[ -n "$token" ]] && grep -Fq -- "$token" "$RUNTIME_LOG_FILE"; then
              echo "::error::bearer token found in failed container startup log"
            elif grep -Fq -- \
              "Permission denied: '/run/secrets/sasori_token'" \
              "$RUNTIME_LOG_FILE"; then
              echo "::error::container could not read the group-scoped bearer-token secret"
            else
              echo "::error::container failed to become ready; runtime log retained for secret audit"
            fi
            exit "$start_status"
          fi

      - name: Verify workflow, restart persistence, and exclusive ownership
        shell: bash
        run: |
          set -euo pipefail

          action_snapshot() {
            local expected_count="$1"
            local output="$2"
            docker compose -p "$COMPOSE_PROJECT_NAME" exec -T sasori \
              python - "$expected_count" > "$output" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          expected_count = int(sys.argv[1])
          expected_summary = "Operator review: diagnostic captured for container acceptance incident"
          path = Path("/data/incident-actions.jsonl")
          data = path.read_bytes() if path.exists() else b""
          lines = data.splitlines()
          if len(lines) != expected_count:
              raise SystemExit("incident action count is invalid")
          if expected_count == 0:
              if data:
                  raise SystemExit("incident action log must be absent or empty before resume")
              summary_digest = None
          elif expected_count == 1:
              def strict_object(pairs):
                  value = {}
                  for key, item in pairs:
                      if key in value:
                          raise ValueError("duplicate action key")
                      value[key] = item
                  return value

              try:
                  record = json.loads(lines[0].decode("utf-8"), object_pairs_hook=strict_object)
              except (UnicodeDecodeError, ValueError):
                  raise SystemExit("incident action record is invalid") from None
              if record != {"summary": expected_summary}:
                  raise SystemExit("incident action summary is invalid")
              summary_digest = hashlib.sha256(expected_summary.encode("utf-8")).hexdigest()
          else:
              raise SystemExit("unsupported expected action count")
          print(json.dumps({
              "count": expected_count,
              "sha256": hashlib.sha256(data).hexdigest(),
              "summary_sha256": summary_digest,
          }, sort_keys=True, separators=(",", ":")))
          PY
            python - "$output" "$expected_count" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_count = int(sys.argv[2])
          expected_summary = "Operator review: diagnostic captured for container acceptance incident"
          expected_summary_digest = (
              hashlib.sha256(expected_summary.encode("utf-8")).hexdigest()
              if expected_count == 1 else None
          )
          valid = (
              isinstance(value, dict)
              and set(value) == {"count", "sha256", "summary_sha256"}
              and type(value["count"]) is int
              and value["count"] == expected_count
              and isinstance(value["sha256"], str)
              and re.fullmatch(r"[0-9a-f]{64}", value["sha256"]) is not None
              and value["summary_sha256"] == expected_summary_digest
          )
          if not valid:
              raise SystemExit("invalid action-log evidence")
          PY
          }

          python scripts/container_acceptance.py prepare \
            --base-url "$SASORI_BASE_URL" \
            --token-file "$SASORI_TOKEN_FILE" \
            --evidence "$CONTAINER_EVIDENCE_FILE" \
            --run-id "$SASORI_ACCEPTANCE_RUN_ID"

          action_snapshot 0 "$ACTION_PAUSED_FILE"

          python scripts/container_acceptance.py complete \
            --base-url "$SASORI_BASE_URL" \
            --token-file "$SASORI_TOKEN_FILE" \
            --evidence "$CONTAINER_EVIDENCE_FILE"

          action_snapshot 1 "$ACTION_COMPLETE_FILE"

          docker compose -p "$COMPOSE_PROJECT_NAME" restart sasori
          docker compose -p "$COMPOSE_PROJECT_NAME" up \
            -d --wait --wait-timeout 120 sasori

          python scripts/container_acceptance.py after-restart \
            --base-url "$SASORI_BASE_URL" \
            --token-file "$SASORI_TOKEN_FILE" \
            --evidence "$CONTAINER_EVIDENCE_FILE"

          action_snapshot 1 "$ACTION_RESTARTED_FILE"
          if ! cmp -s "$ACTION_COMPLETE_FILE" "$ACTION_RESTARTED_FILE"; then
            echo "::error::incident action log changed across container restart"
            exit 1
          fi

          set +e
          docker compose -p "$COMPOSE_PROJECT_NAME" run \
            --rm --no-deps -T --entrypoint python sasori - \
            > "$OWNER_LOG_FILE" 2>&1 <<'PY'
          import sys
          from sasori import ConcurrentRunError, SQLiteStore

          try:
              store = SQLiteStore("/data/sasori.sqlite3")
          except ConcurrentRunError:
              print("ConcurrentRunError", file=sys.stderr)
              raise SystemExit(2)
          else:
              store.close()
              print("second owner unexpectedly acquired the database", file=sys.stderr)
              raise SystemExit(97)
          PY
          owner_status=$?
          set -e
          if [[ "$owner_status" -ne 2 ]]; then
            echo "::error::second database owner exited $owner_status; expected 2"
            exit 1
          fi
          if ! grep -Fxq -- "ConcurrentRunError" "$OWNER_LOG_FILE"; then
            echo "::error::second database owner did not prove ConcurrentRunError"
            exit 1
          fi
          git diff --exit-code HEAD --

      - name: Audit logs and generated reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token_file="${SASORI_TOKEN_FILE:-$RUNNER_TEMP/sasori-token-$suffix}"
          evidence_file="${CONTAINER_EVIDENCE_FILE:-$RUNNER_TEMP/sasori-container-evidence-$suffix.json}"
          paused_file="${ACTION_PAUSED_FILE:-$RUNNER_TEMP/sasori-action-paused-$suffix.json}"
          complete_file="${ACTION_COMPLETE_FILE:-$RUNNER_TEMP/sasori-action-complete-$suffix.json}"
          restarted_file="${ACTION_RESTARTED_FILE:-$RUNNER_TEMP/sasori-action-restarted-$suffix.json}"
          owner_log="${OWNER_LOG_FILE:-$RUNNER_TEMP/sasori-owner-$suffix.log}"
          runtime_log="${RUNTIME_LOG_FILE:-$RUNNER_TEMP/sasori-runtime-$suffix.log}"
          export SASORI_TOKEN_FILE="$token_file"

          : > "$runtime_log"
          set +e
          docker compose -p "$COMPOSE_PROJECT_NAME" logs --no-color sasori \
            > "$runtime_log" 2>&1
          logs_status=$?
          set -e
          audit_status=0
          if [[ ! -s "$token_file" ]]; then
            echo "::error::bearer token file unavailable for log audit"
            audit_status=1
          else
            token="$(<"$token_file")"
            if [[ -z "$token" ]]; then
              echo "::error::bearer token file is empty"
              audit_status=1
            else
              for item in \
                "runtime log:$runtime_log" \
                "second-owner log:$owner_log" \
                "acceptance evidence:$evidence_file" \
                "paused action evidence:$paused_file" \
                "completed action evidence:$complete_file" \
                "restarted action evidence:$restarted_file"; do
                label="${item%%:*}"
                path="${item#*:}"
                if [[ -f "$path" ]] && grep -Fq -- "$token" "$path"; then
                  echo "::error::bearer token found in $label"
                  audit_status=1
                fi
              done
            fi
          fi
          if [[ "$logs_status" -ne 0 ]]; then
            echo "::error::unable to collect runtime logs for secret audit"
            audit_status=1
          fi
          {
            echo "### Container product gate evidence"
            for item in \
              "acceptance:$evidence_file" \
              "paused-action:$paused_file" \
              "completed-action:$complete_file" \
              "restarted-action:$restarted_file"; do
              label="${item%%:*}"
              path="${item#*:}"
              if [[ -f "$path" ]]; then
                lines="$(wc -l < "$path" | tr -d '[:space:]')"
                digest="$(sha256sum "$path" | cut -d ' ' -f 1)"
                printf -- '- `%s`: %s lines, SHA-256 `%s`\n' \
                  "$label" "$lines" "$digest"
              else
                printf -- '- `%s`: missing\n' "$label"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$audit_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Stop containers and remove sensitive local files
        if: always()
        shell: bash
        run: |
          set +e
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          token_file="${SASORI_TOKEN_FILE:-$RUNNER_TEMP/sasori-token-$suffix}"
          owner_log="${OWNER_LOG_FILE:-$RUNNER_TEMP/sasori-owner-$suffix.log}"
          runtime_log="${RUNTIME_LOG_FILE:-$RUNNER_TEMP/sasori-runtime-$suffix.log}"
          export SASORI_TOKEN_FILE="$token_file"
          if [[ ! -e "$token_file" ]]; then
            umask 077
            printf '%s\n' cleanup-placeholder > "$token_file"
          fi
          docker compose -p "$COMPOSE_PROJECT_NAME" down \
            --remove-orphans --timeout 20
          cleanup_status=$?
          for path in "$token_file" "$owner_log" "$runtime_log"; do
            rm -f -- "$path" || cleanup_status=1
          done
          if [[ "$cleanup_status" -ne 0 ]]; then
            echo "::error::container cleanup was incomplete"
            exit 1
          fi

      - name: Upload audited container evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sasori-container-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sasori-container-evidence-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/sasori-action-paused-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/sasori-action-complete-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/sasori-action-restarted-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  package:
    name: Package and release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.project.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Read the locked project version
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]
          if not isinstance(version, str) or not re.fullmatch(
              r"[A-Za-z0-9][A-Za-z0-9._+-]*", version
          ):
              raise SystemExit("project version is unsafe for an artifact name")
          print(f"version={version}")
          PY

      - name: Build wheel and source archive in the locked container
        shell: bash
        run: |
          set -euo pipefail
          image="$(sed -n 's/^ARG PYTHON_BASE=//p' Dockerfile)"
          [[ "$image" =~ ^docker\.m\.daocloud\.io/library/python:[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$GITHUB_WORKSPACE/dist"
          docker run --rm --init \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/dist,target=/out" \
            --entrypoint sh \
            "$image" \
            -ceu '
              export PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
              export PIP_DISABLE_PIP_VERSION_CHECK=1 PIP_NO_CACHE_DIR=1
              mkdir -p /tmp/sasori
              cp /source/pyproject.toml /source/MANIFEST.in /source/README.md \
                 /source/LICENSE /source/SECURITY.md /source/THIRD_PARTY_NOTICES.md \
                 /source/requirements-build.txt /tmp/sasori/
              cp -a /source/docs /source/licenses /source/src /tmp/sasori/
              find /tmp/sasori -type d \( -name "*.egg-info" -o -name __pycache__ \) \
                -prune -exec rm -rf -- {} +
              cd /tmp/sasori
              python -m pip install --require-hashes -r requirements-build.txt
              python -m pip wheel --no-build-isolation --no-deps --wheel-dir /out .
              python - <<PY
          from setuptools.build_meta import build_sdist
          print(build_sdist(chr(47)+chr(111)+chr(117)+chr(116)))
          PY
            '

      - name: Verify unversioned artifacts are not release eligible
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1 && test "${#sdists[@]}" -eq 1
          wheel="${wheels[0]}"
          sdist="${sdists[0]}"
          candidate_root="$(mktemp -d)"
          trap 'rm -rf "$candidate_root"' EXIT
          cp \
            pyproject.toml \
            MANIFEST.in \
            README.md \
            LICENSE \
            SECURITY.md \
            THIRD_PARTY_NOTICES.md \
            requirements-build.txt \
            Dockerfile \
            .dockerignore \
            "$candidate_root/"
          cp -a docs licenses src "$candidate_root/"
          set +e
          python scripts/release_verify.py \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --source-root "$candidate_root" \
            --output dist/release-metadata \
            --allow-dirty-local
          code=$?
          set -e
          test "$code" -eq 5

      - name: Verify exact-tag artifacts are release eligible
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          SASORI_TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1 && test "${#sdists[@]}" -eq 1
          wheel="${wheels[0]}"
          sdist="${sdists[0]}"
          python scripts/release_verify.py \
            --wheel "$wheel" \
            --sdist "$sdist" \
            --source-root . \
            --output dist/release-metadata \
            --trigger-tag "$SASORI_TRIGGER_TAG"

      - name: Assemble the exact-tag release candidate bundle
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          SASORI_TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1 && test "${#sdists[@]}" -eq 1
          python scripts/release_bundle.py assemble \
            --wheel "${wheels[0]}" \
            --sdist "${sdists[0]}" \
            --metadata-root dist/release-metadata \
            --source-root . \
            --output dist/release-candidate \
            --trigger-tag "$SASORI_TRIGGER_TAG"

      - name: Upload the exact-tag release candidate for final gates
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sasori-release-candidate-${{ github.sha }}
          path: dist/release-candidate
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload wheel for installation matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sasori-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload source archive for rebuild matrix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sasori-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Ensure packaging did not change tracked files
        run: git diff --exit-code HEAD --

  wheel-smoke:
    name: "Installed wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}"
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out smoke contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the single built wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sasori-wheel
          path: dist

      - name: Run installed-wheel smoke outside the checkout
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter *.whl)
          if ($wheels.Count -ne 1) { throw "expected exactly one wheel" }
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("sasori-wheel-smoke-" + [guid]::NewGuid().ToString("N"))
          python -m venv $smokeRoot
          if ($LASTEXITCODE -ne 0) { throw "smoke environment creation failed" }
          if ($IsWindows) {
            $smokePython = Join-Path $smokeRoot "Scripts/python.exe"
          } else {
            $smokePython = Join-Path $smokeRoot "bin/python"
          }
          & $smokePython -m pip install --no-index --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "wheel installation failed" }
          Push-Location $env:RUNNER_TEMP
          try {
            & $smokePython (Join-Path $env:GITHUB_WORKSPACE "scripts/installed_wheel_smoke.py")
            if ($LASTEXITCODE -ne 0) { throw "installed-wheel smoke failed" }
          } finally {
            Pop-Location
          }

      - name: Ensure smoke did not change tracked files
        run: git diff --exit-code HEAD --

  sdist-smoke:
    name: "Rebuilt sdist / ${{ matrix.os }} / Python ${{ matrix.python-version }}"
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out consumer contract and build lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the single verified source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sasori-sdist
          path: ${{ runner.temp }}/sasori-sdist

      - name: Rebuild and smoke the source archive outside the checkout
        shell: pwsh
        run: |
          $sdistRoot = Join-Path $env:RUNNER_TEMP "sasori-sdist"
          $sdists = @(Get-ChildItem -LiteralPath $sdistRoot -Filter *.tar.gz)
          if ($sdists.Count -ne 1) { throw "expected exactly one source archive" }
          python scripts/sdist_consumer_smoke.py `
            --sdist $sdists[0].FullName `
            --build-lock requirements-build.txt `
            --consumer-check scripts/installed_wheel_smoke.py `
            --release-verifier scripts/release_verify.py `
            --source-root .
          if ($LASTEXITCODE -ne 0) { throw "source archive consumer smoke failed" }

      - name: Ensure consumer smoke did not change tracked files
        run: git diff --exit-code HEAD --

  release-bundle:
    name: Exact-tag release candidate bundle
    if: ${{ github.ref_type == 'tag' }}
    needs:
      - test
      - package
      - container
      - wheel-smoke
      - sdist-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download the exact-tag release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sasori-release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/sasori-release-candidate

      - name: Reverify the final candidate inventory and subjects
        shell: bash
        env:
          SASORI_TRIGGER_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/release_bundle.py verify \
            --bundle-root "$RUNNER_TEMP/sasori-release-candidate" \
            --source-root . \
            --trigger-tag "$SASORI_TRIGGER_TAG"

      - name: Upload the gated release candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sasori-${{ needs.package.outputs.version }}-release-bundle
          path: ${{ runner.temp }}/sasori-release-candidate
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Ensure bundle verification did not change tracked files
        run: git diff --exit-code HEAD --
