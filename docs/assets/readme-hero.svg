<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Sasori — One kernel, many puppets</title>
  <desc id="description">A dark lacquer and brass banner with an abstract mechanical scorpion and puppet threads.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b0e"/>
      <stop offset="0.58" stop-color="#15191e"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="0.84" cy="0.25" r="0.52">
      <stop offset="0" stop-color="#b52a32" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#b52a32" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d39a"/>
      <stop offset="0.48" stop-color="#c69a52"/>
      <stop offset="1" stop-color="#7b5726"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.6" fill="#fff" opacity="0.08"/>
      <circle cx="24" cy="17" r="0.45" fill="#fff" opacity="0.06"/>
      <circle cx="12" cy="29" r="0.5" fill="#c69a52" opacity="0.08"/>
