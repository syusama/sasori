services:
  sasori:
    build:
      context: .
      args:
        PYTHON_INDEX_URL: ${PYTHON_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: sasori:local
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - sasori-data:/data
    secrets:
      - source: sasori_token
        target: sasori_token
    group_add:
      - "${SASORI_TOKEN_GID:-10001}"
    ports:
      - "127.0.0.1:${SASORI_PORT:-8080}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  sasori-data:

secrets:
  sasori_token:
    file: ${SASORI_TOKEN_FILE:?Set SASORI_TOKEN_FILE to a local bearer-token file}
